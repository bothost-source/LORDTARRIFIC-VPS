services:
  - type: web
    name: LORDTARRIFIC-VPS
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./vps.db
      - key: PYTHON_VERSION
        value: 3.11
